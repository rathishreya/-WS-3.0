:root{
  --bg:#F4F5F7;--surface:#FFF;--soft:#ECEEF1;--sunk:#F7F8FA;--line:#E2E5EA;--line2:#EDEFF2;
  --ink:#112949;--ink-2:#1D3A63;--muted:#5A6472;--faint:#77849A;
  --brand:#EA7B2C;--brand-2:#D96C1F;--brand-ink:#C05F17;--brand-soft:#FDEEE2;--brand-line:#F7CFB0;
  --ai:#3CC3F2;--ai-ink:#1189B6;--ai-soft:#E4F6FD;--ai-line:#BEE9FA;
  --good:#0A351F;--good-mid:#146B41;--good-soft:#E2EEE7;
  --warn:#F1B715;--warn-ink:#9A7205;--warn-soft:#FEF5DC;
  --crit:#901918;--crit-soft:#F7E4E3;
  --ui:'Exo 2.0','Exo 2',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:10px;--sc:0 1px 2px rgba(17,41,73,.04),0 4px 16px rgba(17,41,73,.05);
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:13px/1.45 var(--ui);color:var(--ink);background:var(--bg);display:flex;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
b{font-weight:620}
.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}

/* ========== rails ========== */
.rail,.rrail{width:64px;flex:none;background:var(--surface);display:flex;flex-direction:column;align-items:center;padding:11px 0 12px;gap:2px}
.rail{border-right:1px solid var(--line)}
.rrail{border-left:1px solid var(--line)}
.rlogo{width:33px;height:33px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:740;margin-bottom:9px}
.rb{width:53px;padding:7px 0 5px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);position:relative}
.rb:hover{background:var(--sunk);color:var(--muted)}
.rb .sq{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;transition:transform .2s var(--ease),background .15s,border-color .15s,color .15s}
.rb:hover .sq{transform:translateY(-1px)}
.rb span{font-size:8.5px;font-weight:660;text-align:center;line-height:1.15}
.rb.on{color:var(--ink)}
.rb.on .sq{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 4px 10px -4px rgba(17,41,73,.4)}
.rbadge{position:absolute;top:3px;right:7px;min-width:15px;height:15px;border-radius:8px;background:var(--brand);color:#fff;font-size:8.5px;font-weight:740;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
.rdot{position:absolute;top:5px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--warn);border:2px solid var(--surface)}
.rfoot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(150deg,#D96C1F,#EA7B2C);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:740}
.rsep{width:26px;height:1px;background:var(--line);margin:7px 0}

/* ========== list pane ========== */
.pane{flex:0 0 318px;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line);min-height:0;overflow:hidden;transition:flex-basis .28s var(--ease),width .28s var(--ease)}
.pane.col{flex:0 0 0px;width:0;border-right:none}
.pane>*{min-width:318px}
.psearch{padding:10px 12px 8px;display:flex;gap:8px;align-items:center}
.psearch input{flex:1}
.colbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);color:var(--faint);display:grid;place-items:center;flex:none;transition:color .15s,border-color .15s,background .15s}
.colbtn:hover{color:var(--ink);border-color:#B9C2CE;background:var(--surface)}
.psearch input{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 11px;font:12px var(--ui);color:var(--ink);outline:none}
.psearch input:focus{border-color:#B9C2CE;background:var(--surface)}
.tabs{display:flex;gap:4px;padding:0 12px 10px;border-bottom:1px solid var(--line2)}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:6.5px 4px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid transparent}
.tab:hover{background:var(--sunk)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .tb{min-width:16px;height:16px;padding:0 4px;border-radius:99px;font-size:9.5px;font-weight:680;display:grid;place-items:center;background:var(--brand);color:#fff}
.tabnote{padding:8px 14px 4px;font-size:10px;color:var(--faint);letter-spacing:.2px}
.clist{flex:1;overflow-y:auto;padding:4px 6px 14px}
.ci{display:flex;gap:10px;align-items:center;padding:9px 8px;border-radius:10px;cursor:pointer;position:relative}
.ci:hover{background:var(--sunk)}
.ci.on{background:var(--soft)}
.cav{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:660;position:relative}
.cav.round{border-radius:99px}
.pdot{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:99px;border:2px solid var(--surface)}
.pdot.onl{background:#2E9E5B}.pdot.busy{background:var(--warn)}.pdot.off{background:#C9CFD8}
.cmid{flex:1;min-width:0}
.cn{display:flex;align-items:baseline;gap:6px}
.cn b{font-size:12.5px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn .org{white-space:nowrap;flex:0 0 auto}
.ct{margin-left:auto;font-size:10px;color:var(--faint);font-family:var(--mono);flex:0 0 auto}
.cs{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.cend{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.bdg{font-size:9.5px;font-weight:660;padding:2px 7px;border-radius:99px;letter-spacing:.2px;white-space:nowrap}
.bdg.risk{background:var(--crit-soft);color:var(--crit)}
.bdg.warn{background:var(--warn-soft);color:var(--warn-ink)}
.bdg.prog{background:var(--ai-soft);color:var(--ai-ink)}
.bdg.done{background:var(--good-soft);color:var(--good)}
.bdg.dim{background:var(--soft);color:var(--muted)}
.bdg.cli{background:var(--brand-soft);color:var(--brand-ink)}
.unread{min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--ink);color:#fff;font-size:10px;font-weight:680;display:grid;place-items:center}
.lgroup{font-size:9.5px;font-weight:680;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);padding:12px 10px 5px}
.lempty{padding:28px 14px;text-align:center;color:var(--faint);font-size:12px}
/* money panel */
.mback{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:620;color:var(--faint);padding:10px 10px 0;width:100%;text-align:left}
.mback:hover{color:var(--ink)}
.mrow{display:flex;align-items:center;gap:11px;padding:10px;border-radius:11px;cursor:pointer;width:100%;text-align:left;transition:background .14s,transform .18s var(--ease)}
.mrow:hover{background:var(--sunk);transform:translateX(2px)}
.mrow .mt2{width:36px;height:36px;border-radius:10px;background:var(--sunk);border:1px solid var(--line2);display:grid;place-items:center;color:var(--muted);flex:none}
.mrow .mn2{flex:1;min-width:0}
.mrow .mn2 b{display:block;font-size:12.5px;font-weight:640}
.mrow .mn2 small{font-size:10.5px;color:var(--faint)}
.mrow .mn2 small.w{color:var(--warn-ink)}
.mrow .mvv{font-size:12.5px;font-weight:660;font-variant-numeric:tabular-nums;text-align:right}
.mrow .mvv small{display:block;font-size:9.5px;color:var(--faint);font-weight:480}
.mrow .mvv.c{color:var(--crit)}
.poin{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 9px;font:11px var(--ui);color:var(--ink);outline:none;width:210px}
.poin:focus{border-color:#B9C2CE}
/* assignments — the client's deepest level; activities stay on EZ's side */
.asgr{display:flex;align-items:center;gap:10px;padding:8px 13px;border-top:1px solid var(--line2);font-size:12px}
.asgr .d{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);flex:none}
.asgr .d.done{background:var(--good-mid);border-color:var(--good-mid)}
.asgr .d.warn{background:var(--warn);border-color:var(--warn)}
.asgr .d.now{background:var(--ai);border-color:var(--ai)}
.asgr .an{flex:1;min-width:0}
.asgr .an b{font-size:12px;font-weight:640;display:block}
.asgr .an small{font-size:10.5px;color:var(--faint)}
.asgr .aw{font-size:10px;color:var(--faint);font-family:var(--mono);flex:none}
.msub{margin:1px 4px 6px 27px;padding-left:11px;border-left:1.5px solid var(--line2)}
.msr{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;cursor:pointer;width:100%;text-align:left;transition:background .14s,transform .18s var(--ease)}
.msr:hover{background:var(--sunk);transform:translateX(2px)}
.msr .mi{width:20px;height:20px;border-radius:6px;background:var(--sunk);border:1px solid var(--line2);display:grid;place-items:center;color:var(--muted);flex:none}
.msr b{font-weight:600;color:var(--ink);font-size:11.5px}
.msr .mv{margin-left:auto;font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--faint)}
.msr .mv.w{color:var(--warn-ink);font-weight:640}

/* ========== hero ========== */
.hero{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);position:relative}
.strip{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);cursor:pointer;text-align:left;width:100%;position:relative;z-index:36}
.strip.warn{background:var(--warn-soft);border-bottom-color:#EDD9A4;color:var(--warn-ink)}
.strip b{font-weight:660;color:inherit}
.strip .sic{flex:none;display:grid;place-items:center}
.strip .stx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .scount{flex:none;font-size:10px;font-weight:740;padding:2px 8px;border-radius:99px;background:var(--crit);color:#fff}
.strip .go{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 11px;font-size:11px;font-weight:660;color:var(--muted)}
.strip.warn .go{border-color:#E3C97E;background:#fff;color:var(--warn-ink)}
.strip .okic{color:var(--good-mid)}

.hwrap{flex:1;display:flex;min-height:0;overflow:hidden}
.hmain{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;overflow:hidden}
.thead{flex:0 0 54px;display:flex;align-items:center;gap:11px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.thead .cav{width:34px;height:34px;font-size:11px}
.tht b{font-size:13.5px;font-weight:640;display:flex;align-items:center;gap:8px}
.tht small{display:block;font-size:10.5px;color:var(--faint);margin-top:1px}
.thr{margin-left:auto;display:flex;align-items:center;gap:8px}
.hbtn{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--surface)}
.hbtn:hover{border-color:#B9C2CE;color:var(--ink)}
.tbody{flex:1;overflow-y:auto;padding:20px 24px 26px;scroll-behavior:smooth}
.tin{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.daypill{align-self:center;font-size:10px;font-weight:640;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);background:var(--soft);padding:4px 12px;border-radius:99px}

.msg{max-width:590px}
.msg.me{align-self:flex-end;text-align:right}
.mlab{font-size:10px;color:var(--faint);margin-bottom:3px;padding:0 4px}
.bub{display:inline-block;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:12.5px;box-shadow:var(--sc)}
.me .bub{background:var(--soft);border-color:#D6DBE2}
.human{display:flex;gap:9px;position:relative}
.hav{width:28px;height:28px;border-radius:99px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:660;margin-top:14px}
.hm{font-size:10.5px;color:var(--faint);margin:0 0 3px 4px}
.hm b{font-weight:620;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sc);overflow:hidden}
.card.decide{border-color:#C9D3E2;box-shadow:0 1px 2px rgba(17,41,73,.04),0 10px 28px -14px rgba(17,41,73,.18)}
.card.okc{border-color:#C6DFCE}
.card.crit{border-color:#E5BDBC}
.ch{display:flex;align-items:center;gap:8px;padding:9px 13px 0}
.cdot{width:8px;height:8px;border-radius:99px;background:var(--ai);flex:0 0 auto}
.cdot.ok{background:var(--good-mid)}.cdot.w{background:var(--warn)}.cdot.c{background:var(--crit)}
.cl{font-size:11px;font-weight:660}
.cl .sub{font-weight:520;color:var(--faint)}
.cl .sub.risk{color:var(--crit)}.cl .sub.ok{color:var(--good-mid)}
.ctime{margin-left:auto;font-size:10px;color:var(--faint);font-family:var(--mono)}
.cb{padding:8px 13px 11px;font-size:12.5px;color:var(--ink)}
.cb small{color:var(--muted);font-size:11.5px}
.ca{display:flex;flex-wrap:wrap;gap:7px;padding:0 13px 12px}
.btn{font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.btn:hover{border-color:#B9C2CE}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:var(--ink-2)}
.statrow{display:flex;gap:7px;padding:2px 13px 12px;flex-wrap:wrap}
.stat{flex:1;min-width:100px;background:var(--sunk);border:1px solid var(--line2);border-radius:9px;padding:7px 10px}
.stat b{display:block;font-size:16px;font-weight:660;font-variant-numeric:tabular-nums}
.stat small{font-size:10px;color:var(--faint);letter-spacing:.2px}
.stat b.w{color:var(--warn-ink)}.stat b.c{color:var(--crit)}.stat b.g{color:var(--good-mid)}.stat b.br{color:var(--ai-ink)}
.evt{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--muted)}
.evt .pill{font-size:9px;font-weight:680;letter-spacing:.5px;text-transform:uppercase;padding:2.5px 8px;border-radius:99px}
.pill.int{background:var(--soft);color:var(--muted)}
.pill.cli{background:var(--brand-soft);color:var(--brand-ink)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.evt .ln{flex:1;height:1px;background:var(--line)}
.evt .tm{font-size:10px;color:var(--faint);font-family:var(--mono)}
.qchips{display:flex;flex-wrap:wrap;gap:7px}
.qchip{font-size:11.5px;font-weight:560;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5.5px 12px}
.qchip:hover{border-color:#B9C2CE;color:var(--ink)}

/* mini plan */
.plan{padding:4px 13px 12px}
.prow{display:flex;align-items:center;gap:9px;padding:4.5px 0}
.pn{flex:0 0 148px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptrack{flex:1;height:14px;background:var(--sunk);border:1px solid var(--line2);border-radius:5px;position:relative}
.pbar{position:absolute;top:2px;bottom:2px;border-radius:4px;font-size:8.5px;font-weight:680;color:#fff;display:flex;align-items:center;padding:0 6px;white-space:nowrap}
.pbar.done{background:var(--good-soft);border:1px solid #C6DFCE;color:var(--good)}
.pbar.now{background:var(--good-mid)}
.pbar.warn{background:#E08A3C}
.pbar.idle{background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.ptoday{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--warn);left:52%;border-radius:2px}
.plegend{display:flex;gap:12px;padding:6px 13px 12px;font-size:10px;color:var(--faint);align-items:center}
.plegend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* money cards */
.invr{display:flex;align-items:center;gap:10px;padding:7px 13px;border-top:1px solid var(--line2);font-size:12px}
.invr .ino{font-family:var(--mono);font-size:10.5px;color:var(--faint);flex:0 0 44px}
.invr .inm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.invr .amt{font-variant-numeric:tabular-nums;font-weight:660;flex:0 0 auto}
.invr .amt.c{color:var(--crit)}
.wbig{display:flex;align-items:flex-end;gap:10px;padding:4px 13px 8px}
.wbig .wn b{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.wbig .wn small{display:block;font-size:10.5px;color:var(--faint);margin-top:1px}
.wbig .run{margin-left:auto;text-align:right;font-size:10px;color:var(--faint);letter-spacing:.2px}
.wbig .run b{display:block;font-size:14.5px;color:var(--warn-ink);font-weight:680}
.wseg{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;margin:0 13px}
.wseg i{display:block}
.wleg{display:flex;gap:13px;flex-wrap:wrap;padding:7px 13px 8px;font-size:10.5px;color:var(--muted)}
.wleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.wtx{display:flex;align-items:center;gap:10px;padding:7px 13px;border-top:1px solid var(--line2);font-size:12px}
.wtx .ti{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;background:var(--sunk);border:1px solid var(--line2);color:var(--muted)}
.wtx .tn{flex:1;min-width:0}
.wtx .tn small{display:block;color:var(--faint);font-size:10px}
.wtx .tv{font-variant-numeric:tabular-nums;font-weight:660}
.wtx .tv.neg{color:var(--crit)}
.wtx .tb2{font-variant-numeric:tabular-nums;color:var(--faint);font-size:10.5px;flex:0 0 58px;text-align:right}
.wnote{padding:6px 13px 12px;font-size:11px;color:var(--muted)}
.mch{position:relative;display:flex;align-items:flex-end;gap:2px;margin:4px 13px 0}
.mcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;z-index:2}
.mcol b{font-size:10px;font-weight:660;color:var(--ink);text-align:center;margin-bottom:3px;font-variant-numeric:tabular-nums}
.mcol i{display:block;border-radius:4px 4px 0 0}
.mcol small{text-align:center;font-size:9.5px;color:var(--faint);padding-top:4px}
.mavg{position:absolute;left:0;right:0;border-top:1.5px dashed #A8B2C0;z-index:1}
.mavg span{position:absolute;left:2px;top:-15px;font-size:9px;color:var(--faint);background:var(--surface);padding:0 3px;border-radius:3px}

/* composer */
.comp{flex:0 0 auto;padding:12px 24px 16px;background:linear-gradient(180deg,rgba(244,245,247,0),var(--bg) 40%)}
.cwrap{max-width:760px;margin:0 auto}
.cbox2{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:13px;transition:border-color .2s,box-shadow .2s}
.crow{display:flex;align-items:center;gap:8px;padding:7px}
.crow textarea{flex:1;border:0;outline:none;font:12.5px/1.5 var(--ui);color:var(--ink);background:none;padding:6px 0 6px 4px;min-width:0;resize:none;max-height:130px}
.aimc{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 9px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);flex:none;text-align:left;transition:border-color .15s,background .15s}
button.aimc:hover{border-color:#B9C2CE;background:var(--surface)}
.aimc .ad{width:8px;height:8px;border-radius:99px;flex:none}
.aimc .at{display:flex;flex-direction:column;line-height:1.15}
.aimc .at small{font-size:7.5px;font-weight:740;letter-spacing:.1em;color:var(--faint)}
.aimc .at b{font-size:11px;font-weight:660;white-space:nowrap}
.aimc.teamon{background:var(--soft);border-color:#C7CDD6}
.aimpop{position:absolute;left:7px;bottom:calc(100% + 8px);min-width:270px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 22px 48px -18px rgba(17,41,73,.35),0 4px 14px -6px rgba(17,41,73,.15);padding:5px;z-index:45;animation:novin .18s var(--ease) both}
.apo{display:flex;gap:10px;padding:8px 11px;border-radius:9px;cursor:pointer;align-items:flex-start;width:100%;text-align:left}
.apo:hover{background:var(--sunk)}
.apo .ad{width:8px;height:8px;border-radius:99px;flex:none;margin-top:4px}
.apo .apt{flex:1;min-width:0}
.apo .apt b{display:block;font-size:12px;font-weight:640}
.apo .apt small{font-size:10.5px;color:var(--faint)}
.apo .chk{color:var(--good-mid);flex:none;margin-top:2px}
.apo.hl{background:var(--sunk)}
.mentpop{left:10px;right:10px;min-width:0;max-height:290px;overflow-y:auto}
.mentav{width:26px;height:26px;border-radius:8px;color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;flex:none}
.mentav.round{border-radius:99px}
.menthint{padding:7px 12px 5px;font-size:9.5px;font-weight:680;letter-spacing:.8px;text-transform:uppercase;color:var(--faint)}
.mact2{position:absolute;top:-8px;right:-4px;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 18px -8px rgba(17,41,73,.3);padding:2px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;transform:translateY(3px);z-index:5}
.human:hover .mact2{opacity:1;pointer-events:auto;transform:none}
.mact2 button{font-size:10px;font-weight:640;color:var(--muted);padding:4px 9px;border-radius:7px;white-space:nowrap}
.mact2 button:hover{background:var(--sunk);color:var(--ink)}
.mact2 .em{font-size:13px;padding:2px 6px;line-height:1.4}
.mact2 .emsep{width:1px;background:var(--line2);margin:3px 2px}
.rrow{display:flex;gap:4px;margin-top:4px;padding-left:2px;flex-wrap:wrap}
.rpill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:2.5px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:640;box-shadow:0 1px 2px rgba(17,41,73,.06);transition:transform .16s var(--spring),border-color .14s}
.rpill:hover{border-color:#B9C2CE;transform:scale(1.05)}
.rpill.mine{background:var(--ai-soft);border-color:var(--ai-line);color:var(--ai-ink)}
.tick.seen{color:var(--ai-ink)}
.qbar{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid var(--line2);background:var(--sunk);border-radius:12px 12px 0 0;font-size:11px;color:var(--muted)}
.qbar i{width:3px;align-self:stretch;border-radius:2px;background:var(--ai-ink);flex:none}
.qbar .qt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar .qt b{display:block;font-size:10px;color:var(--ai-ink)}
.qq{display:block;border-left:3px solid var(--ai-line);background:rgba(17,41,73,.05);padding:5px 9px;border-radius:6px;margin-bottom:6px;font-size:11.5px;color:var(--muted)}
.qq b{display:block;font-size:10px;color:var(--ai-ink)}
.clipb{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--faint);flex:0 0 auto}
.clipb:hover{background:var(--sunk);color:var(--ink)}
.jlat{position:absolute;right:22px;bottom:100px;z-index:20;width:34px;height:34px;border-radius:99px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 20px -8px rgba(17,41,73,.35);display:grid;place-items:center;color:var(--muted);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(6px)}
.jlat.on{opacity:1;pointer-events:auto;transform:none}
.jlat:hover{color:var(--ink)}

/* overlays */
.scrim{position:absolute;inset:0;z-index:28;background:rgba(17,41,73,.13);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.nov{position:absolute;left:0;right:0;top:0;z-index:34;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 26px 50px -30px rgba(17,41,73,.5);max-height:0;overflow:hidden;transition:max-height .4s var(--ease)}
.nov.on{max-height:78%;overflow-y:auto}
.novh{display:flex;align-items:center;gap:10px;padding:13px 16px 8px}
.novh h4{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.novh .os{font-size:11px;color:var(--faint)}
.ox{margin-left:auto;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--faint)}
.ox:hover{background:var(--sunk);color:var(--ink)}
.ngrp{font-size:9px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);padding:10px 16px 4px}
.nr{border-top:1px solid var(--line2)}
.nrh{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;cursor:pointer;width:100%;text-align:left}
.nrh:hover{background:var(--sunk)}
.nr.on .nrh{background:var(--sunk)}
.nrd{width:8px;height:8px;border-radius:99px;margin-top:5px;flex:none}
.nrt{flex:1;min-width:0}
.nrt b{font-size:12.5px;font-weight:640;display:block}
.nrt small{font-size:11px;color:var(--muted)}
.nrtm{font-size:10px;color:var(--faint);font-family:var(--mono);flex:none;margin-top:2px}
.nr.dn .nrt b{color:var(--muted);font-weight:560}
.nrdet{padding:2px 16px 13px 34px;font-size:12px;color:var(--muted);animation:novin .3s var(--ease) both}
.nrdet .nact{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
@keyframes novin{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.spanel{flex:0 0 0px;width:0;background:var(--surface);border-left:0 solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:flex-basis .34s var(--ease),width .34s var(--ease)}
.spanel.on{flex:0 0 300px;width:300px;border-left:1px solid var(--line)}
.spanel>*{min-width:300px}
.sph{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line2)}
.sph h4{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.spb{flex:1;overflow-y:auto;padding:6px 8px 14px}
.spr{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:9px;cursor:pointer}
.spr:hover{background:var(--sunk)}
.spr .si{width:28px;height:28px;border-radius:8px;background:var(--sunk);border:1px solid var(--line2);display:grid;place-items:center;color:var(--muted);flex:none}
.spr .st{flex:1;min-width:0}
.spr .st b{font-size:12px;font-weight:620;display:block}
.spr .st small{font-size:10.5px;color:var(--faint)}
.sptag{font-size:9px;font-weight:680;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);background:var(--soft);border-radius:5px;padding:2px 7px;flex:none;margin-top:3px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,80px);background:var(--ink);color:#fff;font-size:12px;font-weight:560;padding:10px 10px 10px 16px;border-radius:11px;box-shadow:0 18px 44px -12px rgba(17,41,73,.5);display:flex;align-items:center;gap:12px;transition:transform .3s var(--spring);z-index:60}
.toast.show{transform:translate(-50%,0)}
.toast button{font-size:11.5px;font-weight:660;color:#8FD8F8;padding:5px 10px;border-radius:7px}
.toast button:hover{background:rgba(255,255,255,.1)}
.flash{animation:fl 1.6s ease-out}
@keyframes fl{0%,45%{box-shadow:0 0 0 3px rgba(17,41,73,.3),var(--sc)}100%{box-shadow:var(--sc)}}

/* ===== premium finish ===== */
:root{--spring:cubic-bezier(.34,1.45,.64,1)}
::selection{background:#DCE4EF;color:var(--ink)}
*{scrollbar-width:thin;scrollbar-color:#D3D8DF transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#D3D8DF;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#B9C2CE}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tin>*{animation:rise .32s var(--ease) both}

  var hu2=rem.closest('.human'); if(!hu2||!hu2.dataset.rk)return;
  var rk=hu2.dataset.rk, em=rem.dataset.remoji;
  var o=REACT[rk]=REACT[rk]||{};
  if(o[em]&&o[em].me){o[em].n--;o[em].me=0;if(o[em].n<=0)delete o[em]}
  else{o[em]=o[em]||{n:0,me:0};o[em].n++;o[em].me=1}
  renderThread(1);return}
 var mact=e.target.closest('[data-mact]');
 if(mact){
  var hu=mact.closest('.human'), who=hu.dataset.who, tx=hu.dataset.text;
  var snip=tx.length>64?tx.slice(0,64)+'…':tx;
  if(mact.dataset.mact==='reply'){REPLY={who:who,text:snip};renderComp();$('ci').focus();return}
  if(mact.dataset.mact==='move'){
   var dd={id:'dyn'+(++DYNN),t:'Follow up — “'+snip+'”',s:'from '+th(CUR).name+' · '+who+' · added by you',
    body:'You turned this message into a move. It stays in your bar until you mark it handled.',open:[CUR,null],done:0};
   DYN.push(dd);
   toast('Added to your moves.',function(){DYN=DYN.filter(x=>x!==dd);renderAll()});
   renderAll();return}
  if(mact.dataset.mact==='ask'){
   if(th(CUR).tab==='req'||th(CUR).tab==='cli'){AUD[CUR]='ai';DRAFT[CUR]='About “'+snip+'” — ';renderComp();$('ci').focus()}
   else{DRAFT.ws='About “'+snip+'” ('+who+', '+th(CUR).name+') — ';open('ws')}
   return}
 }
 var qx=e.target.closest('[data-qx]');
 if(qx){REPLY=null;renderComp();$('ci').focus();return}
 if(POP&&!e.target.closest('.aimpop,[data-aimtoggle]')){
  var kp=$('ci')?$('ci').value:'';POP=0;renderComp();if($('ci'))$('ci').value=kp;
 }
 var el=e.target.closest('[data-open],[data-tab],[data-nav],[data-space],[data-vfilt],[data-mfilt],[data-vrow],[data-tool],[data-notif],[data-mgo],[data-aud],[data-aimtoggle],[data-do],[data-chip],[data-undo],#strip,#scrim');
 if(!el)return;
 if(el.dataset&&el.dataset.aimtoggle!==undefined){
  var kv=$('ci')?$('ci').value:'';POP=POP?0:1;renderComp();if($('ci'))$('ci').value=kv;
  return}
 if(el.id==='scrim'){NOV=0;NSEL=null;renderRails();renderStrip();renderNov();return}
 if(el.dataset&&el.dataset.undo!==undefined){if(UNDOFN)UNDOFN();$('toast').classList.remove('show');return}
 if(el.dataset&&el.dataset.nav){
  var n=el.dataset.nav;
  if(n==='home'){open('ws');return}
  if(n==='money'){open('money');return}
  if(n==='verify'){open('verify');return}
  if(n==='alerts'){NOV=!NOV;NSEL=null;renderRails();renderStrip();renderNov();return}
  if(n==='profile'){toast('In the real build this opens your desk settings & delegation.');return}
  if(n==='help'){toast('In the real build this opens the ops runbook.');return}
 }
 if(el.id==='strip'&&!e.target.closest('[data-do]')){NOV=!NOV;NSEL=null;renderRails();renderStrip();renderNov();return}
 if(el.dataset&&el.dataset.vfilt){VFILT=el.dataset.vfilt;renderTabs();renderList();renderThread(1);return}
 if(el.dataset&&el.dataset.mfilt){MFILT=el.dataset.mfilt;renderTabs();renderList();return}
 var vr=e.target.closest('[data-vrow]');
 if(vr){
  var lid=vr.dataset.vrow, L=VLINES().find(x=>x.id===lid);
  VST[lid]=1;
  toast('Verified — ¤'+L.amt.toLocaleString('en-US')+' billable event emitted. Invoice and payout fire together.',
    function(){delete VST[lid];renderAll()});
  renderAll();return}
 if(el.dataset&&el.dataset.space){
  var k=el.dataset.space;
  if(SPACE[k]&&SPACE[k].work){
   var tid={gantt:'card-gantt',tree:'card-tree',files:'card-files'}[k], ex=$(tid);
   if(ex){ex.scrollIntoView({block:'center'});ex.classList.add('flash');setTimeout(()=>ex.classList.remove('flash'),1400);return}
   EXTRA[CUR]=EXTRA[CUR]||[];
   var rid=CUR;
   EXTRA[CUR].push(k==='gantt'?function(){return ganttFor(rid)}:k==='tree'?function(){return treeFor(rid)}:function(){return filesFor2(rid)||filesCard(rid)});
   renderThread();return}
  SP=(SP===k)?null:k; renderRails(); renderPanel(); return}
 if(el.dataset&&el.dataset.tool){SP=(SP===el.dataset.tool)?null:el.dataset.tool;renderRails();renderPanel();return}
 if(el.dataset&&el.dataset.notif){NSEL=(NSEL===el.dataset.notif)?null:el.dataset.notif;renderNov();return}
 if(el.dataset&&el.dataset.mgo){
  var tid=el.dataset.mgo, mth=el.dataset.mth||'money';
  if(CUR!==mth){open(mth,tid);return}
  var tg=document.getElementById(tid);
  if(tg){tg.scrollIntoView({block:'start'});tg.classList.add('flash');setTimeout(()=>tg.classList.remove('flash'),1700)}
  return}
 if(el.dataset&&el.dataset.aud){AUD[CUR]=el.dataset.aud;POP=0;renderComp();$('ci').focus();return}
 if(el.dataset&&el.dataset.tab){
  TAB=el.dataset.tab;MPANE=0;SQ='';$('q').value='';
  if(CUR==='money'){CUR='ws';delete UNREAD.ws;renderAll();return}
  renderTabs();renderList();return}
 if(el.dataset&&el.dataset.open){open(el.dataset.open);return}
 if(el.dataset&&el.dataset.chip){
  var q=el.dataset.chip;
  EXTRA[CUR]=EXTRA[CUR]||[];
  meMsg(CUR,CUR,esc(q),'now',false);
  if(q==='Tell Dana it holds'){EXTRA[CUR].push(evt('cli','Client-visible','“Friday holds — quality pass tonight.” · sent to the Acme room','now'));renderThread();return}
  aiRespond(CUR,CUR,function(){return aiReply(q)});return}
 if(el.dataset&&el.dataset.do){
  var a=el.dataset.do;
  if(a.indexOf('dyn')===0){var dd2=DYN.find(x=>x.id===a);if(dd2){dd2.done=1;toast('Move handled.',function(){dd2.done=0;renderAll()});renderAll()}return}
  if(a.indexOf('goto:')===0){var parts=a.slice(5).split(':');open(parts[0],parts[1]||null);return}
  if(a==='ratify')return resolve('ratify','Deck is live — tree published, offers out.');
  if(a==='requiet')return resolve('requiet','Offered to Priya — she accepted in 14s. Split logged.');
  if(a==='vnudge')return resolve('vnudge','Dana nudged — client-visible, with the link.');
  if(a==='mapin')return resolve('mapin','Mapped to Nimbus — R-1052 created, composer drafting.');
  if(a==='topup')return resolve('topup','Top-up requested from Globex finance.');
  if(a==='editplan'){toast('Inline edit — re-plans only the part you touch, never a full re-author.');return}
  if(a==='askq'||a==='mapother'||a==='mapreject'||a==='calltariq'||a==='splitother'||a==='autoclose'||a==='negcfg'||a==='drep'||a==='orisk'||a==='show7'||a==='rerun'||a==='lockwin'||a==='exp'){
   toast('In the real build this runs the '+(a==='exp'?'export':'follow-up')+' flow.');return}
  if(a==='tlv')return resolve('tlv','Verified — invoice #2066 raised, Dev’s ¤300 released.');
  if(a==='sendback'){toast('Sent back — the exception routes to the performer before money moves.');return}
  if(a==='tree'){var tr=CUR;
   if($('card-tree')){var xt=$('card-tree');xt.scrollIntoView({block:'center'});xt.classList.add('flash');setTimeout(()=>xt.classList.remove('flash'),1400);return}
   EXTRA[tr]=EXTRA[tr]||[];
   EXTRA[tr].push(function(){return treeFor(tr)||card({dot:'',who:'The tree',sub:'this room',time:'now',body:'No tree here — this room isn’t a request.'})});
   renderThread();return}
  if(a==='gantt'){var gr=CUR;
   if($('card-gantt')){var xg=$('card-gantt');xg.scrollIntoView({block:'center'});xg.classList.add('flash');setTimeout(()=>xg.classList.remove('flash'),1400);return}
   EXTRA[gr]=EXTRA[gr]||[];EXTRA[gr].push(function(){return ganttFor(gr)||''});renderThread();return}
  if(a.indexOf('tadd:')===0){
   var aid=a.slice(5), T=TG[CUR]; if(!T)return;
   var A=T.asg.find(x=>x.id===aid); if(!A)return;
   var nid='new'+(++TADDN);
   A.acts.splice(A.acts.length-(A.acts.some(x=>x.must)?1:0),0,
     {id:nid,n:'New activity',u:'set the units',own:'unallocated',st:'idle',p:0,c:0,due:'set a date'});
   TMENU=null;
   toast('Activity added to '+A.n+' — set its skill, units and performer.',function(){A.acts=A.acts.filter(x=>x.id!==nid);renderThread(1)});
   renderThread(1);return}
  if(a==='tasg'||a==='tnest'){
   var T2=TG[CUR]; if(!T2)return;
   var gid='asg'+(++TADDN);
   T2.asg.push({id:gid,n:a==='tnest'?'Nested assignment':'New assignment',off:'pick an offering',own:'unallocated',
     acts:[{id:gid+'d',n:'Deliver',u:'1 handover',own:'—',st:'idle',p:0,c:0,due:'set a date',must:1}]});
   TMENU=null;
   toast('Assignment added — its Deliver activity was created for you.',function(){T2.asg=T2.asg.filter(x=>x.id!==gid);renderThread(1)});
   renderThread(1);return}
  if(a.indexOf('tpause:')===0){
   var pid=a.slice(7); TPAUSE[pid]=!TPAUSE[pid]; TMENU=null;
   toast(TPAUSE[pid]?'Paused — it stops counting and nothing bills while it is down.':'Resumed.',
     function(){TPAUSE[pid]=!TPAUSE[pid];renderThread(1)});
   renderThread(1);return}
  if(a.indexOf('tcancel:')===0){
   var cid=a.slice(8); TCANCEL[cid]=1; TMENU=null;
   toast('Cancelled — its cost leaves the tree and the margin recomputes.',function(){delete TCANCEL[cid];renderThread(1)});
   renderThread(1);return}
  if(a==='tedit'||a==='tallo'||a==='tdup'){
   TMENU=null;renderThread(1);
   toast('In the real build this opens the '+(a==='tedit'?'edit':a==='tallo'?'re-allocation':'duplicate')+' form inline on the node.');return}
  if(a==='vall'){
   var r=vReady(), tot=r.reduce(function(t,l){return t+l.amt},0), had=Object.assign({},VST);
   r.forEach(function(l){VST[l.id]=1});
   toast('Verified '+r.length+' lines — ¤'+tot.toLocaleString('en-US')+' emitted. Payouts released.',function(){VST=had;renderAll()});
   renderAll();return}
  if(a==='vinv'){
   VINV=1; VFILT='done';
   toast('Sent to invoicing — grouped one invoice per entity per period.',function(){VINV=0;renderAll()});
   renderAll();return}
  if(a==='vrec'){toast('In the real build this opens the pre-computed reconciliation — splits, fees, unit counts, exceptions.');return}
  if(a==='files'){
   var fc=filesFor2(CUR)||card({dot:'',who:'Files',sub:'this room',time:'now',body:'No files on this request yet.'});
   var ex=$('card-files');
   if(ex){ex.scrollIntoView({block:'center'});ex.classList.add('flash');setTimeout(()=>ex.classList.remove('flash'),1400);return}
   var fr=CUR;EXTRA[fr]=EXTRA[fr]||[];EXTRA[fr].push(function(){return filesFor2(fr)||fc});renderThread();return}
  if(a==='attach'){toast('In the real build this opens the attach flow.');return}
  if(a==='pcol'){COL=!COL;$('pane').classList.toggle('col',COL);renderHead();return}
  if(a==='send'){
   var v=$('ci').value.trim();if(!v)return;
   DRAFT[CUR]='';
   var t2=th(CUR), scoped=(t2.tab==='req'&&CUR!=='intake')||t2.tab==='cli';
   var aud=scoped?(AUD[CUR]||(t2.tab==='cli'?'cli':'int')):null;
   meMsg(CUR,CUR,fmtMsg(v),'now',scoped&&aud==='cli');
   if((scoped&&aud==='ai')||CUR==='ws'||CUR==='money'){aiRespond(CUR,CUR,function(){return aiReply(v)});return}
   renderThread();return}
 }
});
document.addEventListener('input',function(e){
 if(e.target.id!=='ci')return;
 DRAFT[CUR]=e.target.value;
 e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,130)+'px';
 var sb=document.querySelector('.send');if(sb)sb.classList.toggle('rdy',!!e.target.value.trim());
 var m=e.target.value.match(/(^|\s)@([^\s]*)$/);
 var was=MENT; MENT=m?m[2]:null;
 if(MENT!==was||MENT!==null){MIDX=0;renderMent()}
});
$('q').addEventListener('input',function(){SQ=this.value.trim();renderList()});
$('tbody').addEventListener('scroll',function(){
 $('jlat').classList.toggle('on',this.scrollHeight-this.scrollTop-this.clientHeight>300);
});
$('jlat').addEventListener('click',function(){var b=$('tbody');b.scrollTo({top:b.scrollHeight,behavior:'smooth'})});
document.addEventListener('keydown',function(e){
 if(MENT!==null&&e.target.id==='ci'){
  if(e.key==='ArrowDown'){MIDX++;renderMent();e.preventDefault();return}
  if(e.key==='ArrowUp'){MIDX=Math.max(0,MIDX-1);renderMent();e.preventDefault();return}
  if(e.key==='Enter'){var hl=document.querySelector('.mentpop .apo.hl');if(hl)selectMention(hl.dataset.ment);e.preventDefault();return}
  if(e.key==='Escape'){MENT=null;renderMent();return}
 }
 if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='ci'){e.preventDefault();var b=document.querySelector('[data-do="send"]');if(b)b.click()}
 if(e.key==='/'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();$('q').focus()}
 if(e.key==='['&&e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA'){COL=!COL;$('pane').classList.toggle('col',COL);renderHead()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('q').focus()}
 if(e.key==='Escape'){
  if(NOV){NOV=0;NSEL=null;renderRails();renderStrip();renderNov()}
  else if(SP){SP=null;renderRails();renderPanel()}
 }
});

renderAll();
</script>
